# ClawHealth Nginx Reverse Proxy
#
# Single entry point for all external traffic.
# Routes:
#   /sms/*    → SMS Router (port 3000) → correct patient container
#   /voice/*  → SMS Router (port 3000) → correct patient container
#   /portal/* → Doctor Portal (port 5001)
#   /api/*    → Doctor Portal API (port 5001)

events {
    worker_connections 256;
}

http {
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate limiting (protect against abuse)
    limit_req_zone $binary_remote_addr zone=sms:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

    upstream sms_router {
        server router:3000;
    }

    upstream doctor_portal {
        server doctor-portal:5001;
    }

    server {
        listen 80;
        server_name _;

        # Redirect HTTP to HTTPS in production
        # Uncomment these lines when you have SSL set up:
        # return 301 https://$host$request_uri;

        # --- Twilio Webhooks → SMS Router ---
        location /sms/ {
            limit_req zone=sms burst=10 nodelay;
            proxy_pass http://sms_router;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location /voice/ {
            limit_req zone=sms burst=5 nodelay;
            proxy_pass http://sms_router;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # --- Doctor Portal ---
        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://doctor_portal;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (for live alerts)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --- Router management API (internal only in production) ---
        location /api/patients {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://sms_router;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- Health checks ---
        location /health/router {
            proxy_pass http://sms_router/health;
        }

        location /health/portal {
            proxy_pass http://doctor_portal/health;
        }
    }

    # HTTPS server — uncomment when you have certs from Let's Encrypt
    # server {
    #     listen 443 ssl http2;
    #     server_name clawhealth.yourdomain.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/clawhealth.yourdomain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/clawhealth.yourdomain.com/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #
    #     # Same location blocks as above...
    # }
}
